[Paths]
tm_archive =
fits_archive = /data/stix/out/test/pipeline_auto_test
spice_kernels =
soop_files =
fido_search_url = file:///data/stix/out/fits_v1.2.0
[Logging]
stop_on_error = False
[IDLBridge]
enabled = False
gsw_path =
[Pipeline]
status_server_port = 12345
parallel_batchsize_L0 = 300
parallel_batchsize_L1 = 300
parallel_batchsize_L2 = 100
flareid_sdc_lut_file = ./stixcore/data/publish/flarelist_sdc_lut.csv
flareid_sc_lut_file = ./stixcore/data/publish/flarelist_sc_lut.csv
[Publish]
db_file = ./stixcore/data/publish/published.sqlite
include_levels = L0
waiting_period = 7d
target_dir = /data/stix/out/test/esa
report_mail_receivers = nicky.hochmuth@ateleris.ch
report_mail_send = False
same_esa_name_dir = /data/stix/out/test/esa_conflicts
rid_lut_file = ./stixcore/data/publish/rid_lut.csv
rid_lut_file_update_url = https://datacenter.stix.i4ds.net/api/bsd/info/
batch_size = 20000
[SOOP]
endpoint = https://solarorbiter.esac.esa.int/soopkitchen/api
user = smaloney
password = set_in_user_ini
soop_files_download = ./stixcore/data/soop
[ECC]
ecc_path = /opt/stix_det_cal/bin/
[Processing]
flarelist_sdc_min_count = 1000
# background-data-file lookup (find_background_file_for_time)
flarelist_bkg_window_past_days = 21
flarelist_bkg_window_future_days = 21
flarelist_bkg_min_duration_s = 500
# require the background file to share the flare's on-board ELUT configuration (ELUTManager lookup)
flarelist_bkg_require_same_elut = True
# optional stricter selection (default OFF - all three move common cases, not just edge cases):
#   purpose preference: prefer purpose=="Background" unless a subject-only match is this many days closer
#   (0.0 disables); exclude "elevated" backgrounds; drop requests whose comment references a flare id
flarelist_bkg_purpose_penalty_days = 0.0
flarelist_bkg_exclude_elevated = False
flarelist_bkg_exclude_flare_comment = True
